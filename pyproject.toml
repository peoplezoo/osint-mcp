[project]
name = "osint-mcp"
version = "2.0.0"
description = "Hybrid OSINT MCP server — pure-Python collectors + optional Sherlock/Maigret/Holehe/theHarvester/subfinder and composite investigation tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OSINT MCP contributors" }]
keywords = ["osint", "mcp", "reconnaissance", "security", "sherlock", "maigret"]
dependencies = [
    "mcp>=1.0.0",
    "aiohttp>=3.9.0",
    "dnspython>=2.4.0",
    "python-whois>=0.9.0",
    "phonenumbers>=8.13.0",
]

[project.optional-dependencies]
# Classic identity / recon CLIs (install on host or use Docker)
identity = [
    "sherlock-project>=0.15.0",
    "maigret>=0.4.4",
    "holehe>=1.61",
]
recon = [
    "theHarvester>=4.6.0",
    "dnstwist>=20240812",
]
shodan = ["shodan>=1.31.0"]
all = [
    "osint-mcp[identity,recon,shodan]",
]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
osint-mcp = "osint_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osint_mcp"]
